name: Frontend CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-cd.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-cd-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:

  # ==========================================================
  # BUILD, SCAN AND PUSH FRONTEND IMAGE
  # ==========================================================

  build-scan-and-push:
    name: Build, Scan and Push Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # AWS LOGIN USING OIDC
      # ------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}


      # ------------------------------------------------------
      # ECR LOGIN
      # ------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ------------------------------------------------------
      # CREATE IMAGE URI
      # ------------------------------------------------------

      - name: Set image URI
        id: image
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

          echo "============================================"
          echo "IMAGE URI"
          echo "$IMAGE_URI"
          echo "============================================"


      # ------------------------------------------------------
      # BUILD IMAGE
      # ------------------------------------------------------

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --pull \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            ./frontend


      # ------------------------------------------------------
      # SECURITY SCAN
      # ------------------------------------------------------

      - name: Trivy Docker Image Scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true


      # ------------------------------------------------------
      # PUSH IMAGE
      # ------------------------------------------------------

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


      # ------------------------------------------------------
      # SUCCESS
      # ------------------------------------------------------

      - name: Display image
        run: |
          echo "============================================"
          echo "Frontend image pushed successfully"
          echo "${{ steps.image.outputs.image_uri }}"
          echo "============================================"


  # ==========================================================
  # DEPLOY FRONTEND TO EC2 USING SSM
  # ==========================================================

  deploy-frontend:
    name: Deploy Frontend to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-scan-and-push

    steps:

      # ------------------------------------------------------
      # AWS LOGIN USING OIDC
      # ------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}


      # ------------------------------------------------------
      # DEPLOY
      # ------------------------------------------------------

      - name: Deploy Frontend to EC2
        env:
          IMAGE_URI: ${{ needs.build-scan-and-push.outputs.image_uri }}
          WEB_INSTANCE_IDS: ${{ vars.WEB_INSTANCE_IDS }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

        run: |

          set -e

          echo "============================================"
          echo "STARTING FRONTEND DEPLOYMENT"
          echo "============================================"
          echo "Image: $IMAGE_URI"
          echo "Instances: $WEB_INSTANCE_IDS"
          echo "Region: $AWS_REGION"
          echo "============================================"


          # --------------------------------------------------
          # VALIDATION
          # --------------------------------------------------

          if [ -z "$IMAGE_URI" ]; then
            echo "ERROR: IMAGE_URI is empty"
            exit 1
          fi

          if [ -z "$WEB_INSTANCE_IDS" ]; then
            echo "ERROR: WEB_INSTANCE_IDS is empty"
            exit 1
          fi

          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "ERROR: AWS_ACCOUNT_ID is empty"
            exit 1
          fi


          # --------------------------------------------------
          # CREATE SSM COMMAND JSON
          # --------------------------------------------------

          cat > commands.json <<EOF
          {
            "commands": [
              "set -e",

              "echo ============================================",
              "echo Starting frontend deployment",
              "echo ============================================",

              "echo Logging into Amazon ECR",
              "aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com",

              "echo Pulling frontend image",
              "sudo docker pull $IMAGE_URI",

              "echo Removing old frontend container",
              "sudo docker rm -f taskhub-frontend || true",

              "echo Starting new frontend container",
              "sudo docker run -d --restart unless-stopped --name taskhub-frontend -p 80:80 $IMAGE_URI",

              "echo Waiting for container",
              "sleep 5",

              "echo Checking running containers",
              "sudo docker ps",

              "echo Checking frontend health",
              "curl -fsS http://localhost",

              "echo Removing unused Docker images",
              "sudo docker image prune -af || true",

              "echo ============================================",
              "echo FRONTEND DEPLOYMENT SUCCESSFUL",
              "echo ============================================"
            ]
          }
          EOF


          # --------------------------------------------------
          # VALIDATE JSON
          # --------------------------------------------------

          echo "Validating SSM command JSON..."

          jq . commands.json > /dev/null

          echo "commands.json is valid"


          # --------------------------------------------------
          # SEND SSM COMMAND
          # --------------------------------------------------

          echo "Sending SSM command..."

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=InstanceIds,Values=$WEB_INSTANCE_IDS" \
            --parameters file://commands.json \
            --comment "Deploy TaskHub Frontend $GITHUB_SHA" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "============================================"
          echo "SSM COMMAND ID: $COMMAND_ID"
          echo "============================================"


          # --------------------------------------------------
          # WAIT FOR EACH INSTANCE
          # --------------------------------------------------

          sleep 5

          FAILED=0

          for INSTANCE_ID in $(echo "$WEB_INSTANCE_IDS" | tr ',' ' '); do

            echo ""
            echo "============================================"
            echo "CHECKING INSTANCE: $INSTANCE_ID"
            echo "============================================"

            STATUS="Pending"

            while true; do

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "Status" \
                --output text 2>/dev/null || echo "Pending")

              echo "Current status: $STATUS"

              if [ "$STATUS" = "Success" ]; then
                break
              fi

              if [ "$STATUS" = "Failed" ] || \
                 [ "$STATUS" = "Cancelled" ] || \
                 [ "$STATUS" = "TimedOut" ] || \
                 [ "$STATUS" = "Cancelling" ]; then

                echo "Deployment failed on $INSTANCE_ID"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --output json || true

                FAILED=1
                break
              fi

              sleep 5

            done


            echo ""
            echo "FINAL OUTPUT FOR $INSTANCE_ID"

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --output json || true

          done


          # --------------------------------------------------
          # FINAL RESULT
          # --------------------------------------------------

          if [ "$FAILED" -ne 0 ]; then
            echo "============================================"
            echo "FRONTEND DEPLOYMENT FAILED"
            echo "============================================"
            exit 1
          fi

          echo "============================================"
          echo "FRONTEND DEPLOYMENT SUCCESSFUL ON ALL EC2 INSTANCES"
          echo "============================================"


      # ------------------------------------------------------
      # FINAL SUCCESS
      # ------------------------------------------------------

      - name: Deployment completed
        run: |
          echo "============================================"
          echo "Frontend CD completed successfully"
          echo "============================================"