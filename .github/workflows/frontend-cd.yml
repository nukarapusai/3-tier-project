name: Frontend CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-cd.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-cd-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:

  # ==========================================
  # BUILD, SCAN AND PUSH IMAGE TO ECR
  # ==========================================
  build-scan-and-push:
    name: Build, Scan and Push Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:

      # ============================
      # CHECKOUT
      # ============================
      - name: Checkout code
        uses: actions/checkout@v4


      # ============================
      # AWS OIDC AUTHENTICATION
      # ============================
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}


      # ============================
      # LOGIN TO AMAZON ECR
      # ============================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================
      # CREATE IMAGE URI
      # ============================
      - name: Set image URI
        id: image
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

          echo "Deploying image:"
          echo "$IMAGE_URI"


      # ============================
      # BUILD DOCKER IMAGE
      # ============================
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --pull \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ./frontend


      # ============================
      # CONTAINER SECURITY SCAN
      # ============================
      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true


      # ============================
      # PUSH IMAGE TO AMAZON ECR
      # ============================
      - name: Push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


      # ============================
      # DEPLOYMENT INFORMATION
      # ============================
      - name: Display deployment image
        run: |
          echo "Image successfully pushed:"
          echo "${{ steps.image.outputs.image_uri }}"


  # ==========================================
  # DEPLOY TO WEB EC2 INSTANCES USING SSM
  # ==========================================
  deploy:
    name: Deploy Frontend to EC2
    needs: build-scan-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================
      # AWS OIDC AUTHENTICATION
      # ============================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}


      # ============================
      # DEPLOY USING AWS SSM
      # ============================
      - name: Deploy to Web EC2 Instances
        env:
          IMAGE_URI: ${{ needs.build-scan-and-push.outputs.image_uri }}
          WEB_INSTANCE_IDS: ${{ vars.WEB_INSTANCE_IDS }}
        run: |

          echo "Deploying image:"
          echo "$IMAGE_URI"

          # Convert comma-separated instance IDs to space-separated
          INSTANCE_IDS=$(echo "$WEB_INSTANCE_IDS" | tr ',' ' ')

          echo "Target instances:"
          echo "$INSTANCE_IDS"

          # Create SSM commands
          cat > commands.json <<EOF
          {
            "commands": [
              "set -e",
              "echo Starting frontend deployment",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin \$(echo $IMAGE_URI | cut -d/ -f1)",
              "docker pull $IMAGE_URI",
              "docker stop taskhub-frontend || true",
              "docker rm taskhub-frontend || true",
              "docker run -d --name taskhub-frontend --restart unless-stopped -p 8080:80 $IMAGE_URI",
              "docker ps",
              "echo Frontend deployment completed successfully"
            ]
          }
          EOF

          # Send deployment command
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids $INSTANCE_IDS \
            --parameters file://commands.json \
            --comment "Deploy frontend GitHub SHA $GITHUB_SHA" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id $(echo "$INSTANCE_IDS" | awk '{print $1}')

          echo "Frontend deployment command completed"


      # ============================
      # SHOW DEPLOYMENT STATUS
      # ============================
      - name: Deployment completed
        run: |
          echo "======================================"
          echo "Frontend deployment completed"
          echo "Image:"
          echo "${{ needs.build-scan-and-push.outputs.image_uri }}"
          echo "Instances:"
          echo "${{ vars.WEB_INSTANCE_IDS }}"
          echo "======================================"