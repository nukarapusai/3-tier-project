name: Frontend CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-cd.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-cd-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

# ==========================================================
# BUILD, SCAN AND PUSH FRONTEND IMAGE
# ==========================================================

jobs:

  build-scan-and-push:
    name: Build, Scan and Push Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:

      # ----------------------------------------------------------
      # CHECKOUT CODE
      # ----------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # AWS OIDC AUTHENTICATION
      # ----------------------------------------------------------

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}


      # ----------------------------------------------------------
      # LOGIN TO AMAZON ECR
      # ----------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ----------------------------------------------------------
      # CREATE IMAGE URI
      # ----------------------------------------------------------

      - name: Set image URI
        id: image
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

          echo "Image URI:"
          echo "$IMAGE_URI"


      # ----------------------------------------------------------
      # BUILD DOCKER IMAGE
      # ----------------------------------------------------------

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --pull \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ./frontend


      # ----------------------------------------------------------
      # SECURITY SCAN
      # ----------------------------------------------------------

      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true


      # ----------------------------------------------------------
      # PUSH IMAGE TO ECR
      # ----------------------------------------------------------

      - name: Push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


      # ----------------------------------------------------------
      # DISPLAY IMAGE
      # ----------------------------------------------------------

      - name: Display deployment image
        run: |
          echo "============================================"
          echo "Image successfully pushed"
          echo "${{ steps.image.outputs.image_uri }}"
          echo "============================================"


# ==========================================================
# DEPLOY FRONTEND TO EC2
# ==========================================================

  deploy-frontend:
    name: Deploy Frontend to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-scan-and-push

    steps:

      # ----------------------------------------------------------
      # AWS OIDC AUTHENTICATION
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}


      # ----------------------------------------------------------
      # DEPLOY USING AWS SSM
      # ----------------------------------------------------------

      - name: Deploy Frontend EC2 Instances
        env:
          IMAGE_URI: ${{ needs.build-scan-and-push.outputs.image_uri }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          WEB_INSTANCE_IDS: ${{ vars.WEB_INSTANCE_IDS }}

        run: |

          echo "============================================"
          echo "Starting Frontend Deployment"
          echo "Image: $IMAGE_URI"
          echo "Instances: $WEB_INSTANCE_IDS"
          echo "============================================"

          # Safety check
          if [ -z "$WEB_INSTANCE_IDS" ]; then
            echo "ERROR: WEB_INSTANCE_IDS is empty!"
            exit 1
          fi

          cat > commands.json <<EOF
          {
            "commands": [
              "set -e",
              "echo 'Logging into Amazon ECR'",
              "aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com",

              "echo 'Pulling frontend image'",
              "sudo docker pull $IMAGE_URI",

              "echo 'Stopping old frontend container'",
              "sudo docker stop taskhub-frontend || true",

              "echo 'Removing old frontend container'",
              "sudo docker rm taskhub-frontend || true",

              "echo 'Starting new frontend container'",
              "sudo docker run -d --restart unless-stopped --name taskhub-frontend -p 80:80 $IMAGE_URI",

              "echo 'Removing unused Docker images'",
              "sudo docker image prune -af || true",

              "echo 'Frontend deployment completed'",
              "sudo docker ps"
            ]
          }
          EOF

          echo "Sending SSM command..."

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=InstanceIds,Values=$WEB_INSTANCE_IDS" \
            --parameters file://commands.json \
            --comment "Deploy TaskHub Frontend" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "============================================"
          echo "SSM Command ID: $COMMAND_ID"
          echo "============================================"

          echo "Waiting for deployment..."

          sleep 5

          for INSTANCE_ID in $(echo "$WEB_INSTANCE_IDS" | tr ',' ' '); do

            echo "============================================"
            echo "Checking deployment on: $INSTANCE_ID"
            echo "============================================"

            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION"

            echo "Deployment output:"

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION"
          done


      # ----------------------------------------------------------
      # DEPLOYMENT COMPLETE
      # ----------------------------------------------------------

      - name: Deployment completed
        run: |
          echo "============================================"
          echo "Frontend deployment completed successfully"
          echo "============================================"