name: Frontend CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-cd.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-cd-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-2
  AWS_ACCOUNT_ID: "170542423661"
  ECR_REPOSITORY: taskhub-frontend

jobs:
  build-scan-and-push:
    name: Build, Scan and Push Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================
      # CHECKOUT
      # ============================

      - name: Checkout code
        uses: actions/checkout@v4


      # ============================
      # AWS OIDC AUTHENTICATION
      # ============================

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::170542423661:role/GitHubActions-TaskHub-Frontend-ECR
          aws-region: ${{ env.AWS_REGION }}


      # ============================
      # LOGIN TO AMAZON ECR
      # ============================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================
      # BUILD DOCKER IMAGE
      # ============================

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --pull \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ./frontend


      # ============================
      # CONTAINER SECURITY SCAN
      # ============================

      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true


      # ============================
      # PUSH IMAGE TO AMAZON ECR
      # ============================

      - name: Push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


      # ============================
      # DEPLOYMENT INFORMATION
      # ============================

      - name: Display deployment image
        run: |
          echo "Image successfully pushed:"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"